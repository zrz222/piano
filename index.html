<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>横屏离线高精度钢琴｜乐谱载入</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color: transparent;}
html,body{height:100%;overflow:hidden;background:#202022;font-family:system-ui}

/* ========== 竖屏提示层 ========== */
#rotateTip{
  display:none;
  position:absolute;
  inset:0;
  background:#111;
  color:#fff;
  z-index:999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:16px;
  font-size:20px;
  padding:20px;
  text-align:center;
}
@media (orientation:portrait){
  #rotateTip{display:flex;}
  .mainContainer{display:none;}
}

/* ========== 主容器（横屏布局） ========== */
.mainContainer{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ===== 上方乐谱区域 ===== */
.scorePanel{
  height:42%;
  background:#f8f8f8;
  display:flex;
  flex-direction:column;
}
.scoreToolbar{
  padding:8px;
  background:#333;
  color:white;
  display:flex;
  gap:10px;
  align-items:center;
}
#fileInput{display:none;}
.btnLoad{
  padding:5px 10px;
  background:#2b78e4;
  color:white;
  border:none;
  border-radius:4px;
  font-size:14px;
}
.scoreView{
  flex-grow:1;
  overflow-y:auto;
}
#scoreImg{
  max-width:100%;
  display:block;
}
.placeholderText{
  padding:30px;
  text-align:center;
  color:#666;
}

/* ===== 下方钢琴键盘区域 ===== */
.pianoWrap{
  flex-grow:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  overflow-x:auto;
}
.piano{
  display:flex;
  height:92%;
  position:relative;
}
.white{
  width:46px;
  height:100%;
  background:#fff;
  border:1px solid #555;
  border-radius:0 0 7px 7px;
  z-index:1;
  position:relative;
}
.white:active,.white.press{background:#dddddd;}
.black{
  width:27px;
  height:63%;
  background:#121212;
  z-index:2;
  position:absolute;
  margin-left:-13.5px;
  border-radius:0 0 5px 5px;
}
.black:active,.black.press{background:#444;}
</style>
</head>
<body>

<!-- 竖屏翻转提示 -->
<div id="rotateTip">
  <div>🔄 请横向翻转手机</div>
  <div style="font-size:16px;opacity:0.8">本钢琴设计为横屏演奏，翻转后即可使用乐谱与琴键</div>
</div>

<div class="mainContainer">
  <!-- 乐谱面板 -->
  <div class="scorePanel">
    <div class="scoreToolbar">
      <button class="btnLoad" onclick="document.getElementById('fileInput').click()">📂 载入乐谱图片</button>
      <input id="fileInput" type="file" accept="image/*">
    </div>
    <div class="scoreView">
      <div class="placeholderText" id="scorePlaceholder">点击上方按钮上传乐谱图片<br>载入图片后支持上下滑动浏览</div>
      <img id="scoreImg" />
    </div>
  </div>

  <!-- 钢琴键盘 -->
  <div class="pianoWrap">
    <div class="piano" id="piano"></div>
  </div>
</div>

<script>
// ========= 乐谱载入逻辑 =========
const fileInput = document.getElementById("fileInput");
const scoreImg = document.getElementById("scoreImg");
const scorePlaceholder = document.getElementById("scorePlaceholder");
fileInput.onchange = function(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    scoreImg.src = e.target.result;
    scorePlaceholder.style.display = "none";
  }
  reader.readAsDataURL(file);
}

// ========= 高精度十二平均律 =========
const A4 = 440.0;
const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const startOctave =3;
const totalNotes =36; // C3 ~ B5，3八度

function getFreq(noteIndex){
  const A4Octave = 4;
  const A4IndexInOct = 9;
  const globalA4 = A4Octave * 12 + A4IndexInOct;
  const oct = startOctave + Math.floor(noteIndex / 12);
  const inOct = noteIndex % 12;
  const globalThisNote = oct * 12 + inOct;
  const semitoneDiff = globalThisNote - globalA4;
  return A4 * Math.pow(2, semitoneDiff / 12);
}

let audioCtx;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playNote(freq){
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  // ADSR包络模拟钢琴
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.72, audioCtx.currentTime +0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.8);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 2.8);
}

// =========渲染琴键=========
const pianoEl = document.getElementById("piano");
for(let i=0;i<totalNotes;i++){
  const note = noteNames[i%12];
  const freq = getFreq(i);
  let key;
  if(note.includes("#")){
    key = document.createElement("div");
    key.className = "black";
    key.style.left = (i * 46)+"px";
  }else{
    key = document.createElement("div");
    key.className = "white";
  }

  const pressStart = (e)=>{
    e.preventDefault();
    key.classList.add("press");
    playNote(freq);
  }
  const pressEnd = ()=> key.classList.remove("press");

  key.addEventListener("mousedown", pressStart);
  key.addEventListener("mouseup", pressEnd);
  key.addEventListener("mouseleave", pressEnd);
  key.addEventListener("touchstart", pressStart, {passive:false});
  key.addEventListener("touchend", pressEnd);
  pianoEl.appendChild(key);
}

// 尝试锁定横屏（部分浏览器支持）
async function lockLandscape(){
  try{
    if(screen?.orientation?.lock){
      await screen.orientation.lock("landscape");
    }
  }catch(err){
    console.log("当前浏览器不支持屏幕锁定，手动翻转即可");
  }
}
lockLandscape();
</script>
</body>
</html>
